version: 2

models:
  - name: stg_facebook_account
    description: >
      Cleaned Facebook ad accounts. One row per ad account.
      Types are standardised; no business logic is applied here.
    columns:
      - name: account_id
        description: Facebook ad account ID. Stored as a string to avoid truncating long IDs. Primary key.
        data_tests:
          - unique
          - not_null

      - name: account_name
        description: Account name as set in Facebook. Contains brand, channel and region (e.g. "Vantora Web - DACH 89").
        data_tests:
          - not_null

      - name: ad_currency_code
        description: ISO currency code the account spends in. Spend must not be summed across different currencies.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'EUR']
              config:
                severity: warn

      - name: account_created_at
        description: When the account was created on Facebook (UTC).

      - name: account_updated_at
        description: Last update timestamp from the source (UTC). Looks like a load time rather than a real change time, so don't use it for business logic.