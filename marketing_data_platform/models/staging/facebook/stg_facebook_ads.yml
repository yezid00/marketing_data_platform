version: 2

models:   
  - name: stg_facebook_ads
    description: >
      Facebook ads (creatives). One row per ad. Links each ad to its
      campaign, ad group and account.
    columns:
      - name: ad_id
        description: Facebook ad ID. Primary key.
        data_tests:
          - unique
          - not_null

      - name: campaign_id
        description: Campaign the ad belongs to. Joins to stg_facebook_campaign.
        data_tests:
          - not_null

      - name: ad_group_id
        description: Ad group the ad belongs to.

      - name: account_id
        description: Ad account that owns the ad. Joins to stg_facebook_account.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook_account')
                field: account_id

      - name: ad_name
        description: Ad name as set in Facebook. Follows a structured naming convention (creator, format, theme, angle, language, aspect ratio, version).

      - name: ad_status
        description: Delivery status of the ad (e.g. ACTIVE, PAUSED, ARCHIVED).
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'PAUSED', 'ARCHIVED']
              config:
                severity: warn

      - name: ad_updated_at
        description: Last time the ad was changed in Facebook (UTC).